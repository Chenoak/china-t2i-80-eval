  reference_facts: Dispersion in a polyhedron occurs when light enters, refracts at different interfaces, and separates into its constituent colors. As light strikes a polyhedron's surface at an angle, it refracts due to changes in speed, bending different wavelengths by varying degrees. This effect is similar to a prism. Internal reflection within the polyhedron further enhances the color separation. Geometric angles of incidence and refraction determine the path and extent of dispersion, causing vivid spectral colors to appear as the light exits. Materials like glass or crystal with angled faces amplify this phenomenon by maximizing refraction and reflection pathways.
