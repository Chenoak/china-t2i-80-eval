  source_prompt: "Create a single-image webpage mockup titled “Resonance in an RLC Circuit: Peaks, Bandwidth, and Phase”. Layout:\n- Header with tabs (Concept / Circuit / Sweep / Bode / FAQ).\n- Hero: a clean circuit diagram (series RLC with AC source) with labeled component values and measurement points.\n- Main body:\n  - A frequency sweep section with a prominent plot of current amplitude vs frequency (show a resonance peak).\n  - A phase plot (phase vs frequency) below it.\n  - A ‘Key takeaways’ panel defining resonance frequency and quality factor in plain language.\nAdditional requirements:\n- If component values are shown, the resonance peak location and phase transition must be consistent with them.\n- Explain correctly how resistance affects peak sharpness (Q) and bandwidth.\nCrisp, web-like typography; no placeholder text."
