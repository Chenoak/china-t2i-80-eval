  source_prompt: 'Create a tall, single-page digital marketing landing layout in portrait orientation with a soft background gradient that transitions from very light peach on the left edge to warmer coral and pink tones on the right, with subtle curved vertical bands and faint shadows beneath floating elements. At the very top, include a thin header row: on the left place a tiny dark gray circular status dot followed by small regular sans-serif text in black reading a server time; in the center place a compact orange rectangular logo with a white geometric monogram above small orange sans-serif text; on the right align three equal-sized circular buttons, each with white icons: a solid green circle labeled in white uppercase sans-serif as SIGNIN, a solid purple circle labeled SIGNUP, and a solid red circle with a white hamburger-menu icon. In the hero section, on the upper left, add a text block: first a small line of red-orange uppercase sans-serif reading a tagline, then on the next lines a very large bold uppercase sans-serif title where the word “TROC” is solid black and the immediately adjacent word “HEE” is bright orange, followed below by the phrase “EXCHANGE SOLUTION” in medium-weight black uppercase sans-serif with wide letter spacing. Directly to the left of the word “EXCHANGE” place an overlapping triple-circle icon composed of three flat circles in teal, blue, and violet that intersect slightly. Beneath the title, add a few lines of medium-gray placeholder body copy in regular sans-serif. Below this text, place two horizontally aligned pill-shaped buttons: the primary call-to-action on the left is a wide pill with fully rounded ends, filled with solid bright orange, no border, and white uppercase sans-serif text reading “GET STARTED”; the secondary CTA to its right is simple black uppercase sans-serif text reading “READ MORE ?” without a filled background. Slightly below and left of the hero title, add a smaller rounded-rectangle cryptocurrency info card with soft corners, using a horizontal gradient from pale peach on the left to deeper orange on the right, a faint drop shadow, a small black heading line, bold black numeric text (such as “0.46 ETH”) and a dollar equivalent in smaller gray text, plus a small rounded square on the right containing an orange gradient coin icon with a white symbol. Centered in the upper half of the page, in front of the background, render a detailed 3D cartoon-style panda mascot jumping or lunging forward toward the viewer, wearing a bright orange hoodie, matching baggy pants, and an orange cap, all trimmed with white and gray, plus chunky silver chains including a large dollar-sign medallion; angle the body dynamically with one foot extended toward the viewer and add a soft shadow below. On the upper right side of the hero section, stack four vertical rounded-rectangle statistic cards of equal width with soft shadows: the top card filled with rich emerald green, the second with saturated medium blue, the third with bright red, and the fourth with golden yellow; each card contains, from left to right, a small colored circle matching the card color with a simple white line icon and to its right two lines of white sans-serif text showing labels like Total Members “365”, Online Members “30+”, Total Deposit “$1245”, and Total Withdraw “$1245”. Just below the hero area, create the about section on a crisp white background overlaid with very faint angular star-like polygons. On the left half, place a small red uppercase sans-serif label “BRIEFLY ABOUT US”, below it a large multi-line heading in bold black uppercase sans-serif saying “WE OFFER A WIDE RANGE OF SERVICE”, and underneath a paragraph of gray lorem-ipsum text in regular-weight sans-serif. Under this paragraph, align two pill-shaped buttons horizontally: the left pill, slightly wider, has an orange gradient from light at the left to deeper at the right, fully rounded ends, and light placeholder-style text such as “Enter Your Email” in white sans-serif; the right pill is white with a thin dark gray border, fully rounded ends, and black uppercase sans-serif text reading “FREE TRAIL”. On the right half of this section, add a tall rounded-rectangle video panel whose background has a vertical gradient transitioning from light peach at the top to warm orange at the bottom. Inside its upper-left quadrant, place a smaller square or hexagonal red-orange icon with a centered white play triangle, representing a video button, with the words “PLAY VIDEO” in black uppercase sans-serif beneath it. Directly below this label, centered, include a vertical rectangular slider bar with sharp corners: fill the bar with a vertical gradient that is deep blue at the bottom, shifting to violet and ending in magenta at the top; overlay a small circular slider handle near the middle of the bar, connected to a minimal control line, and above the bar place a small black “+50%” label indicating the slider value. On the right side of this video panel, overlapping toward the middle and lower area, place a second 3D panda mascot in the same orange streetwear outfit, posed in a crouching or landing motion with both hands forward, again with visible chains and white-soled sneakers, casting a faint shadow on the panel. In the bottom-right corner of the video panel, add a small square button with slightly rounded corners, filled with a golden-yellow to orange gradient and containing a bold white diagonal arrow pointing up and to the right. Below this section, design the pricing area on a very light peach background that includes a subtle dotted pattern concentrated on the right side. Centered at the top of this area, place the line “PICK YOUR PLAN” in small red uppercase sans-serif, then below it the heading “INVESTMENT PROCESS” in larger bold black uppercase letters, followed by a short gray paragraph in regular sans-serif. Under the paragraph, arrange three equal-width pricing cards horizontally and evenly spaced. Each card is a tall rounded rectangle with slightly cut or notched top corners, soft drop shadow, and abstract bubbles or shapes faintly visible within the gradient fill. The left card, labeled at the top with small white uppercase sans-serif “PLAN 1”, has a vertical gradient from teal at the top to emerald green at the bottom and contains large white bold text “25% For 10 Days” followed by smaller white lines listing “Min Deposit – $10”, “Max Deposit – $100”, “Principal Include”, “Daily for 10days”, and “24/7 Support”. The middle card, labeled “PLAN 2”, has a vertical gradient from medium blue at the top to deep indigo at the bottom and similar white text, but with “35% For 20 Days” and higher deposit values. The right card, labeled “PLAN 3”, uses a vertical gradient from bright orange at the top to strong red at the bottom with white text reading “48% For 30 Days” and the highest deposit values, mirroring the same list structure. Throughout the composition, scatter several small circular currency badges as decorative elements along the right edge and near section breaks: each badge is a perfect circle filled with an orange gradient from lighter center to darker rim, with a thin inner highlight and a soft outer drop shadow, and contains a simple flat white line icon of a currency symbol in the center. Use a consistent modern sans-serif typeface family for all text, with headings bold and uppercase and body copy regular weight, and ensure all lines and card edges are crisp, solid, and free of dashed or dotted strokes.'
