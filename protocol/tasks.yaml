  rubric_type: knowledge_reference
  reference_facts: Animal and plant cells share several organelles such as the nucleus, mitochondria, endoplasmic reticulum, Golgi apparatus, and ribosomes. However, plant cells have a rigid cell wall made of cellulose that provides structural support, which animal cells lack. Plant cells also contain chloroplasts for photosynthesis, while animal cells do not. Vacuoles are present in both but are typically larger in plant cells. The cell membrane surrounds both plant and animal cells, maintaining cellular integrity and mediating the movement of substances in and out. These differences and similarities define the unique yet overlapping functionalities of animal and plant cells.
