  reference_facts: The industrial brewing process begins with malting, where grains are soaked, germinated, and dried. Next is mashing, where malted grains are mixed with water to convert starches into sugars. The resulting wort is boiled and hops are added for flavor and preservation. After boiling, the wort is cooled and transferred to fermentation tanks, where yeast is added to convert sugars into alcohol and carbon dioxide. This stage can last several days to weeks. Post-fermentation, the beer is conditioned to develop flavor, then filtered and pasteurized. Finally, the beer is packaged for distribution in bottles, cans, or kegs.
