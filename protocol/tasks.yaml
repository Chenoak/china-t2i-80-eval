  rubric_type: knowledge_reference
  reference_facts: Ocean currents play a crucial role in influencing climate by redistributing heat across the planet. Warm currents, like the Gulf Stream, transfer heat from the equator towards the poles, warming nearby coastal regions, while cold currents can cool nearby landscapes. This movement of water also impacts temperature patterns by stabilizing temperatures, reducing extremes. Ocean circulation helps regulate global climate by affecting atmospheric conditions; for example, currents can influence weather events and precipitation. Additionally, the exchange of heat and moisture between oceans and the atmosphere aids in driving climatic phenomena such as monsoons and tropical storms.
  frozen: false
