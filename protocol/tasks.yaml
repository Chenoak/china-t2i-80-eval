  rubric_type: knowledge_reference
  reference_facts: Tsunamis form when tectonic plates shift, causing underwater earthquakes. This occurs at subduction zones where one plate dives beneath another, leading to a sudden displacement of water above the earthquake's epicenter. The energy released generates powerful ocean waves that travel across the sea at high speeds. As these waves reach shallower coastal waters, they slow down and increase in height, becoming destructive. The initial underwater disturbance and subsequent energy transfer cause the waves to grow, impacting land with significant force. Tsunamis can also result from underwater volcanic eruptions or landslides, but earthquakes are the primary cause.
  frozen: false
