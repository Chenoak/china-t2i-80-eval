  source_prompt: 'Create a clean, high-resolution multi-panel dashboard on a white background using a modern sans-serif font like Arial, with a centered page title at the very top reading “Company Org Chart Dashboard”. Use a newspaper-style mosaic layout with seven labeled panels (A)–(G), placing each panel label in the top-left corner inside its panel. Do not include any data table in the image. Layout constraints (must all be satisfied): (1) Panel (A) is a tall anchor panel on the far left and spans the full height of the dashboard content area. (2) Panel (G) is a narrow vertical sidebar immediately to the right of (A) and runs vertically, separating the left anchor from the right block. (3) Panels (B) and (C) are in the upper-right block to the right of (G), stacked vertically with (B) above (C). (4) Panels (D), (E), and (F) form a single bottom row across the full width to the right of (A), placed below (G), below (B), and below (C). (5) The left edges of (B) and (C) align with the left edge of the right block (immediately right of (G)). (6) The right edges of (B), (C), (D), (E), and (F) align to a common right boundary. (7) The top edge of (A) aligns with the top edge of (B), and the bottom edge of (A) aligns with the bottom edge of the bottom-row panels (D)-(F). (8) Panels (D), (E), and (F) are equal-height and aligned along a shared baseline, and their top edges align with each other. (9) Add a non-trivial structural pattern: an inset callout card inside panel (A) that slightly overlaps the org chart content area in the lower-right corner of (A), containing a mini “Key totals” summary. Panel (A) (primary content): recreate the original organizational chart exactly as described: centered within (A) draw a vertical hierarchy of rounded rectangles connected by thin light-gray orthogonal lines; top center light-gray box “Shareholders” with smaller second line “Team size: 3”; directly below light-gray box “Board” with second line “Team size: 5”; below that a dark red box for CEO labeled two lines “Atle Sivertsen” and “CEO – Team size: 1”; under the CEO, a horizontal row of four equal medium-blue boxes connected vertically to the CEO, left-to-right: “Christer Vasseng” / “CTO – Team size: 8”, “Torstein Hønsi” / “CPO – Team size: 6”, “Anita Nesse” / “CSO – Team size: 5”, “Anne Jorunn Fjærestad” / “CFO – Team size: 4”; beneath executives, medium-green team boxes connected to the correct manager: under CTO one box “Product developers” / “Team – Team size: 10”; under CPO one box “Web devs, sys admin” / “Team – Team size: 7”; under CSO two boxes stacked vertically and centered under her with connector lines: upper “Sales team” / “Team – Team size: 6”, lower “Marketing team” / “Team – Team size: 5”; no team boxes under CFO; use white text in all colored boxes for contrast, keep box sizes consistent within each level, and ensure each team-size number is clearly readable. Inset in (A): the overlapping inset card reads “Key totals” and lists a few numbers only (no long lists): “Executives: 4”, “Teams: 4”, “Largest team: 10”. Panel (G) (narrow sidebar legend & hierarchy key): show a vertical legend with small rounded swatches and labels in order top-to-bottom: light gray “Governance”, dark red “CEO”, blue “Executives”, green “Teams”; beneath the legend add a short “Hierarchy notes” block with two bullet points and only two numeric callouts: “Depth: 4 levels” and “Direct reports to CEO: 4”. Panel (B) (upper-right, comparison chart): a horizontal bar chart titled “Leadership team sizes (people)” comparing CEO and the four executives, with bars ordered top-to-bottom: CEO 1, CTO 8, CPO 6, CSO 5, CFO 4; color CEO bar dark red and executive bars blue; place numeric value labels only at the end of each bar (1, 8, 6, 5, 4) and keep axis minimal. Panel (C) (below B, distribution view): a donut chart titled “Headcount by layer” with four segments using the same palette as the org chart: Governance (Shareholders+Board) total 8, CEO 1, Executives 23 (8+6+5+4), Teams 28 (10+7+6+5); place only four numeric labels near the donut segments (8, 1, 23, 28) and a small center label “Total shown: 60”. Panel (D) (bottom row left, KPI strip panel): a compact set of three large-number tiles titled “KPIs” arranged horizontally within (D): “Total headcount shown: 60”, “Largest single node: Product developers (10)”, “Smallest node: CEO (1)”; keep only these three numbers prominent. Panel (E) (bottom row middle, team comparison): a vertical bar chart titled “Team sizes (teams only)” with four green bars labeled “Product developers 10”, “Web devs, sys admin 7”, “Sales team 6”, “Marketing team 5”, with numeric labels above each bar (10, 7, 6, 5) and minimal gridlines. Panel (F) (bottom row right, diagnostic/structure slice): a simple node-link mini-map titled “Reporting fan-out” showing three stacked rows of labeled counts: top row “Governance nodes: 2”, middle row “Leadership nodes: 5” (CEO+4 execs), bottom row “Team nodes: 4”; connect rows with light gray lines and include only these three numeric labels (2, 5, 4). Maintain consistent typography, thin light-gray separators between panels, and ensure all labels remain readable without clutter.'
