  source_prompt: 'Create a single-panel academic-style infographic on a white page. Place one large horizontal rectangular panel centered on the page with a very light beige interior and a thin medium-gray solid rectangular border. At the very top inside the panel, add exactly 1 slightly darker beige header band; in the header, place centered bold black sans-serif title text exactly: "Heterogeneous Image Types". Directly under the header band, add a thin navy dashed horizontal separator line spanning the panel interior. Beneath the header, place exactly 12 flat vector icons arranged as a 3 by 4 grid (3 rows, 4 columns); each icon sits inside its own small rounded rectangle tile (exactly 12 tiles total) with a light-gray dotted border and white fill. Under each icon tile, place exactly 1 centered short black label in regular sans-serif, title case, matching these 12 strings exactly (left to right, row by row): Row 1: "Diagram", "Table", "Plot", "Chart"; Row 2: "Photograph", "Chemical Structure", "Painting", "Medical Image"; Row 3: "Sheet Music", "Geometric Shape", "Pathology Image", "Comic". Define the icon pictograms with clear, countable shapes and line styles as follows: Diagram icon shows exactly 3 navy circles (nodes) connected by exactly 2 teal dashed arrows (arrowheads visible) arranged as a simple flow; Table icon shows a spreadsheet with exactly 4 columns and 3 rows drawn with medium-gray solid grid lines, plus one orange header row band; Plot icon shows 2 navy solid axis arrows (x and y), one purple solid rising line, and exactly 4 orange circular data points on the line; Chart icon shows exactly 4 vertical olive bars of different heights on a navy solid baseline, with a small teal solid upward arrow at the right edge; Photograph icon shows a camera with an orange rounded-rectangle body, one large navy circular lens, and one small crimson circular indicator light; Chemical Structure icon shows exactly 6 teal circles connected by solid gray bonds forming a hexagon plus exactly 1 purple circle attached by one solid bond; Painting icon shows an olive rectangular picture frame containing a simple purple circle “sun” and teal hill shape, plus one orange paintbrush with a crimson tip angled across the frame; Medical Image icon shows a teal dotted outline of a human torso (simple silhouette) with exactly 3 horizontal orange dashed scan lines crossing it and a crimson solid crosshair (two perpendicular lines) centered on the chest; Sheet Music icon shows a staff of exactly 5 navy solid horizontal lines with exactly 3 purple filled noteheads (each with a short solid stem) placed on the staff; Geometric Shape icon shows one crimson diamond (rhombus) and one olive triangle overlapping slightly, both with navy solid outlines; Pathology Image icon shows a microscope slide as one navy rounded rectangle with a centered orange circle “sample” and exactly 3 small purple dots inside the sample; Comic icon shows exactly 2 overlapping speech bubbles (one teal, one purple), each outlined with a crimson dashed border and each containing exactly 3 small navy dots. Below the 3x4 grid, still inside the same panel, add a left-aligned two-line text block in smaller regular sans-serif black font; the first line must read exactly: "Diagrams, Tables, Plots and Charts, Photographs, Chemical Structures, Paintings," and the second line must read exactly: "Medical Images, Sheet Music, Geometric Shapes, Pathology Images, Microscopic Images, Comics." Keep all graphics crisp, flat, minimal, and verifiable; include no extra panels, no extra icons, and no decorative background elements outside the bordered panel.'
