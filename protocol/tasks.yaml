  source_prompt: 'Create a single wide-panel scientific architecture diagram on a white background, clean vector style with crisp lines, consistent sans-serif font, high-contrast text, and clear hierarchy. Add a top-centered title ''Hybrid Neuro-Symbolic Reasoning System'' and directly beneath it a multi-clause subtitle ''Three NL tasks, structured into logic/constraints, solved symbolically, then verbalized''. Use three top rounded light-gray boxes aligned horizontally with small corner panel tags ''Panel A'', ''Panel B'', ''Panel C''. Left box header must be ''Physics problem'' and inside include short line bullets: ''Metals conduct electricity.'', ''Insulators do not conduct electricity.'', ''MadeOfIron(x) implies Metal(x).'', ''Nails are made of iron.'', and ''Question: Nails cannot conduct electricity.'' Middle box header must be ''Model popularity problem'' and inside include: ''No giant LM has bad performance.'', ''Good performance implies used by researchers.'', ''Used by researchers implies popular.'', ''ModelA is a giant language model.'', ''If ModelA is giant then ModelB is giant.'', and ''Query: ModelB is popular.'' Right box header must be ''Car show puzzle'' and inside include: ''Vehicles: tractor, convertible, minivan.'', ''Tractor is second-oldest.'', ''Minivan is newer than convertible.'', and ''Choose true: A, B, or C.''. Centered below, draw a large pale-yellow rounded rectangle labeled ''Problem Formulator'' and connect each top box to it with solid downward arrows colored green (from Panel A), blue (from Panel B), and orange (from Panel C); add a small inline legend near the arrows with the exact labels ''Green = Physics'', ''Blue = Popularity'', ''Orange = Car puzzle''. Place two short callout annotations with leader arrows: one pointing to the colored arrows reading ''Callout: color tracks task'' and one pointing to the formulator box reading ''Callout: parses to symbols''. Directly underneath, place three medium rounded rectangles left-to-right with matching colored downward arrows from the formulator: a light green box titled ''Logical Form 1'' containing headings ''Rules:'', ''Facts:'', ''Query:'' and the rule lines ''Metal(x) -> ConductsElectricity(x).'', ''MadeOfIron(x) -> Metal(x).'', ''Insulator(x) -> not ConductsElectricity(x).'', the fact lines ''MadeOfIron(Nail).'', ''Insulator(Plastic).'', and the query line ''ConductsElectricity(Nail)?''; a light blue box titled ''Logical Form 2'' containing headings ''Facts:'' and ''Query:'' and the fact lines ''not exists x (LanguageModel(x) and Giant(x) and not GoodPerformance(x)).'', ''forall x ((LanguageModel(x) and GoodPerformance(x)) -> UsedByResearchers(x)).'', ''forall x (UsedByResearchers(x) -> Popular(x)).'', ''LanguageModel(ModelA) and Giant(ModelA).'', ''LanguageModel(ModelB).'', ''((LanguageModel(ModelA) and Giant(ModelA)) -> Giant(ModelB)).'', followed by query ''Popular(ModelB)?''; and a light orange box titled ''Constraint Model'' containing ''Domain: 1=oldest, 3=newest.'', ''Variables: tractor, convertible, minivan.'', and ''Constraints: tractor=2; minivan>convertible; AllDifferent.''. Beneath these, draw a large dashed-border rounded rectangle spanning most of the width labeled at its top-left ''Symbolic Reasoner'' and inside place four small rounded boxes left-to-right labeled ''Logic Programming'', ''First-order Prover'', ''Constraint Optimization'', ''SMT Solver''. Connect ''Logical Form 1'' to ''Logic Programming'' with a solid green downward arrow, connect ''Logical Form 2'' to ''First-order Prover'' with a solid blue downward arrow, and connect ''Constraint Model'' to ''Constraint Optimization'' with a solid orange downward arrow; add a right-pointing dashed arrow from ''First-order Prover'' to ''SMT Solver'' and add a second short callout pointing to this dashed arrow that reads ''Callout: dashed means optional''. Directly below, centered, draw another dashed-border rounded rectangle labeled ''Result Interpreter'', and from each of the four modules draw solid downward arrows into it. Inside the Result Interpreter, place three clearly separated result text snippets aligned left-to-right: ''ConductsElectricity(Nail) = True.'', ''Entails Popular(ModelB).'', and ''{convertible:1, tractor:2, minivan:3}''. At the bottom left, slightly below the interpreter, add a rounded light-gray box labeled ''Answer'' with a small checkmark icon, containing three final outputs: ''Nails cannot conduct electricity: false.'', ''ModelB is popular: true.'', and ''A) convertible is oldest.''. Add a small bottom-margin footnote sentence reading ''Footnote: Arrow colors link each task to its corresponding solver family.'' Ensure every quoted string appears exactly as written and is legible.'
