  source_prompt: 'Create a single-image chart dashboard titled “Dynastic Timeline (China, Ancient to Late Imperial): Duration Comparison”.

    Requirements:

    - Main chart: a horizontal bar chart showing the durations (years) of at least 10 major Chinese dynasties from Qin through Qing (include Qin, Han, Tang, Song, Yuan, Ming, Qing; you may add others like Sui, Jin, etc.).

    - Add a small inset timeline strip above the bars showing chronological order with start/end years.

    - Include a short text block (3–5 bullets) explaining 3 major transitions (e.g., fragmentation/unification patterns) without modern politics.

    - Include one small line-art illustration of an iconic artifact/technology label per era group (e.g., bronze, papermaking, printing, compass, gunpowder) and label it.

    All numbers and dates must be historically consistent; typography must be crisp.'
