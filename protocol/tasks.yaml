  source_prompt: 'Create a flat infographic on a horizontal 16:9 canvas with a solid very light warm beige background and no texture, borders, gradients, or shadows. Centered slightly below the vertical midpoint, place a perfect circle filled with a solid dark muted teal blue-green color, with no outline; the circle’s diameter should be roughly one third of the width of the surrounding pillar rectangles and about one sixth of the canvas width. Inside this circle, set four centered lines of bold white all-caps sans-serif text reading, from top to bottom, “7 PILLARS OF CUSTOMER SERVICE,” with even line spacing. Around this circle, arrange seven identical horizontally oriented rounded rectangles representing pillars, all fully opaque, filled with a solid medium warm orange and outlined with a thin uniform solid black stroke, each significantly wider than tall. Position two of these rounded rectangles in the upper middle area above the circle: one directly above and slightly left of the circle titled “COMMUNICATION,” and one above and slightly right titled “PILLAR GOES HERE”; position two more as a vertically stacked left column to the left of the circle, two as a vertically stacked right column to the right of the circle aligned with the left column, and one centered below the circle as a bottom pillar. Each orange pillar rectangle should be identical in size and corner rounding and placed so that the top and bottom rows are horizontally aligned between left and right columns. Connect the central circle to each orange rectangle with a thin straight solid black line segment: two lines angling upward to the two top pillars, two lines angling to the left column pillars, two lines angling to the right column pillars, and one vertical line extending downward from the bottom of the circle to the bottom-center pillar; ensure there are exactly seven such connector lines, each touching the circle’s edge and the midpoint of the nearest side of its rectangle. In the top-left upper pillar rectangle labeled “COMMUNICATION,” place centered bold black all-caps sans-serif title text “COMMUNICATION” on the first line and below it two lines of smaller regular-weight black sans-serif sentence-case text reading “Clear and professional verbal or written communication goes a long way in ensuring customer satisfaction.” In the other six orange pillar rectangles, center a bold black all-caps sans-serif title line reading “PILLAR GOES HERE,” followed by two lines of smaller regular black sans-serif body text reading “Supporting details and examples go here.” At the very top of the canvas, centered horizontally and separate from the pillar system, add a wide horizontal rounded rectangle header bar filled with a darker burnt orange distinct from the pillars and outlined with a thin solid black stroke; make it span more than half the canvas width and be about one quarter as tall as its width-to-height ratio. Inside this header bar, place one line of centered bold white all-caps sans-serif text reading “BUSINESS NAME GOES HERE.” Use the same clean modern sans-serif typeface throughout the graphic, with bold weight for all titles and regular weight for all supporting text, and ensure all text and shapes are fully opaque with no gradients or transparency to maintain a simple flat design.'
