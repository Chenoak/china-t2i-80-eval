  source_prompt: 'Create a single-page radial infographic layout with one large circular hub centered on the page and ten distinct vertical rectangular panels arranged around it in a loose ring. The central circle serves as the main title area and is divided into an upper title block and a lower text block; the upper portion contains a bilingual headline describing “Step 0: The Golden Rules” and the lower portion contains four numbered or bulleted guideline items stacked vertically. From the edge of this circle, draw ten curved connector lines radiating outward in different directions; each curved line terminates at one of the numbered surrounding panels and has a small character or mascot illustration placed near its outer end, visually grouping that character with its panel. Across the top of the page, place four numbered panels in a single horizontal row above the central circle: panel 1 at the top-left, panel 2 to its right, panel 3 to the right of panel 2, and panel 4 at the top-right. Each of these top panels is internally structured as a vertical stack with a heading row at the top, a content area in the middle, and a short caption area at the bottom. In panel 1, the middle content area contains a single row of two document-like thumbnails placed side by side above a stylized word element, all beneath the centered heading and above the caption. In panel 2, the middle area contains a grid of small character illustrations arranged as two rows and three columns, and beneath this grid is a row of two media-related icons above a line of explanatory text. In panel 3, the middle content consists of two stacked rows of example images, each row holding two side-by-side panels, forming a two-by-two grid under the heading. In panel 4, the middle portion has two example image rows one above the other, each row holding a pair of related images, all above a small caption block. On the right side of the page, place panel 5 at the right-center, horizontally aligned with the central circle; inside it, stack three vertical zones with a heading at the top, a central grid, and a caption at the bottom. The central grid has two rows and two columns: the upper row shows a floor-plan-like image on the left and a room-like image on the right, and the lower row shows another pair of corresponding images, with directional arrows indicating conversion between the upper and lower rows. Directly below panel 5, at the lower-right of the page, place panel 6, also divided into heading, middle, and caption zones; its middle section contains two example images stacked vertically in a single column. Slightly left of panel 6 and below the central circle, place panel 7; it has a heading row with a small brain-like icon, a middle region where a mathematical formula block occupies the middle-left area and a small interior-scene illustration sits toward the lower-right, and a caption line at the bottom. Directly left of panel 7 and roughly centered below the circle, place panel 8; it has a heading at the top, a large storyboard grid in the middle containing multiple small rectangular frames arranged in several rows and columns, and a caption at the bottom. To the left of panel 8 at the lower-left of the page, place panel 9, structured with a heading, a central area showing stacked wireframe layout diagrams and a smaller grid example, and a caption beneath them. On the left-center side of the page, to the left of the central circle and above panel 9, place panel 10; it has a heading at the top, a middle area with several square app-like icons arranged in a small block above short explanatory text, and at the bottom a single elongated rectangular control element with arrow indicators. Ensure all headings appear at the top of their respective panels, all captions appear at the bottom within each panel, and all ten panels are connected to the central circular hub by their own curved radial lines to recreate the overall mind-map structure.'
