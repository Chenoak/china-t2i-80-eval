  normalized_stratum: biology
  prompt_length: short
  rubric_type: knowledge_reference
  reference_facts: The process of seed germination begins with water absorption, causing the seed to swell and the seed coat to break. The embryonic root (radicle) emerges first to anchor the plant and absorb nutrients. Next, the embryonic shoot (plumule) grows upwards. As the shoot rises, the seedling forms and begins photosynthesis to produce energy for growth. The cotyledons may emerge as the first leaves, providing initial nutrients. Eventually, true leaves develop, allowing the plant to continue growing and maturing into a fully developed plant. Proper conditions such as moisture, warmth, and oxygen are essential for successful germination.
