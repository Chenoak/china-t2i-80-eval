  source_prompt: 'Recreate a single-page educational infographic image organized vertically. At the very top-center, place a prominent single-line main title reading ''Core exam points quick notes: Asia geography''. Directly below this title, still in the top-center, add a slightly smaller single-line heading that reads ''Knowledge keypoints quick table''. Under this heading, create a grid of six rounded rectangular cards arranged as two rows and three columns. In the upper-left card of this grid, add three centered text lines from top to bottom: ''Location'', ''Line about hemispheres and position'', and ''Line about surrounding oceans''. In the upper-middle card, add three lines reading: ''Extent'', ''Line about being the largest continent'', and ''Line about area, latitude span, and east-west distance''. In the upper-right card, also three lines, reading: ''Relief'', ''Line about high center and lower edges'', and ''Line about a high plateau region''. In the second row of the grid, the lower-left card (aligned under the Location card) should have three lines: ''Rivers'', ''Line about radial outward flow'', and ''Line about large inland drainage area''. The central card in the second row (aligned under the Extent card) should contain four lines where the first is the card heading ''Climate'' and the next three are a numbered list written exactly as: ''1. Line about complex and diverse climate'', ''2. Line about monsoon climate areas'', and ''3. Line about continental climate in the interior''. The lower-right card in the grid (aligned under the Relief card) should contain four lines: a heading ''Population and economy'' followed by three body lines reading ''Line about having the largest population'', ''Line about regional distribution differences'', and ''Line about economic development contrasts''. Below this entire grid, in the horizontal center of the page, place a single-line section heading that reads ''Topographic profile interpretation (key point)''. Under this heading, occupy the central area with two large side-by-side graphics: on the center-left, a map-style image of Asia with a topographic cross-section, and on the center-right, a simplified hill-shaped profile diagram. Directly below the left map graphic, place a two-line caption group centered under it, with the first line ''Northern latitude profile of Asia'' and the second line ''Pattern: high - low - high''. Directly below the right profile graphic, place another two-line caption group, centered under the right graphic, with the first line ''Eastern longitude profile of Asia'' and the second line ''Pattern: low - high - low''. Beneath the diagram section, along the bottom part of the page, create two side-by-side rectangular blocks. On the bottom-left, place a block containing one heading line followed by four list lines; the heading at the top of this block reads ''Typical example questions'', and the four lines below it, arranged vertically as a list, read ''Example 1: question about geographic location'', ''Example 2: question about monsoon climate'', ''Example 3: question about river flow direction'', and ''Example 4: question about population and economy''. On the bottom-right, place another block aligned horizontally with the left block; it has a heading line at the top that reads ''Study suggestions'' and below it a vertical numbered list of three lines reading exactly ''1. Suggestion about using maps for memorization'', ''2. Suggestion about linking causes and effects'', and ''3. Suggestion about comparing and summarizing''. Keep all text exactly as specified while maintaining the described positions and groupings, ensuring that headings, cards, captions, lists, and footer appear in the same relative layout.'
