  source_prompt: "Create a vertical poster titled “Draw-to-Solve (Harder): 4 Algebra/Functions Problems with Graphs”.\nRequirements:\n- 4 sections, each includes: visual model/graph, algebra steps, final answer.\n- Problems (print verbatim):\n  1) Quadratic roots: Solve x^2 − 5x − 14 = 0 and show the parabola with intercepts.\n  2) Piecewise distance: A person walks 1.2 km east in 15 min, rests 10 min, then walks 0.8 km west in 20 min. Draw the position–time graph and find average speed and average velocity.\n  3) Exponential growth: A culture starts with 200 cells and doubles every 3 hours. Write N(t) and find when it exceeds 10,000.\n  4) Systems: Solve 2x + 3y = 13 and 4x − y = 5; show intersection on a coordinate grid.\nContent requirements:\n- Graphs must match solutions exactly; include units where needed.\nNo placeholders; sharp readable text."
