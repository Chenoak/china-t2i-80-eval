  source_prompt: 'Recreate a slide-style image whose content is entirely in English, organized with a large title at the top, a horizontal divider line beneath the title, a two-column banded layout in the middle with five horizontal gray bands each containing an icon on the far left, a challenge statement in the left-central column and a corresponding evidence statement in the right-central column, and a set of source references plus branding along the bottom. At the very top-center of the image place a single-line title that reads exactly: "These systemic barriers are underpinned by a set of cross-cutting, but actionable challenges". Directly below this title, spanning the full width, place a thin horizontal divider line. Immediately beneath the divider line, in the upper center-left area above the bands, add a two-line heading for the left column whose first line reads "Behavioral health care faces a range of" and whose second line reads "challenges, including:"; align this heading to the left side of the central content area. To the right of a narrow central vertical strip with a circular arrow icon, and at the same vertical level as the left heading, place a single-line right-column heading reading: "These challenges are evidenced by the fact that:". Below these headers, construct five horizontal gray bands stacked vertically in the central area; each band has three aligned zones from left to right: a small icon area at the far left (medical cross, hand-with-dollar, brain, circular arrows, and head-with-spiral, respectively for bands one through five), a left text block describing the challenge, and a right text block providing evidence. In the first gray band beneath the headers, to the right of the medical cross icon, place a left-side three-line challenge paragraph whose lines read exactly: "Shortage of behavioral health professionals" on line one, "and physical health professionals with" on line two, and "behavioral health competency" on line three; horizontally aligned in the same band but on the right side, place a two-line evidence paragraph whose first line reads "63% of US counties have a shortage of psychiatrists¹; only 8% of" and whose second line reads "medical schools have a required course on addiction²", preserving the percent signs, semicolon, and superscript reference markers ¹ and ². In the second gray band from the top, next to a hand-with-dollar icon on the far left, place a left-side two-line challenge paragraph whose first line reads "Inadequate reimbursement policies and" and whose second line reads "under-funding of behavioral health services"; aligned to the right within the same band, add a two-line evidence paragraph with the first line "Reimbursements were ~20% lower for behavioral healthcare" and the second line "than for primary care in 2017³", including the tilde before 20 and the superscript ³ after 2017. In the third gray band, next to a brain icon on the left, place a three-line challenge paragraph whose lines read: "Lack of scale for evidence-based" on line one, "interventions for mental and substance" on line two, and "use disorders" on line three; in the right side of that same band, place a two-line evidence paragraph whose first line reads "Only 5% of adolescents with first episode psychosis and 10% of" and whose second line reads "preschoolers with ADHD receive guideline-concordant care⁴", maintaining the percent signs, the phrase "guideline-concordant", and the superscript ⁴. In the fourth gray band, next to a circular arrows icon on the left, place a three-line left-side challenge paragraph whose first line reads "Poor integration of physical health," (including the trailing comma), whose second line reads "behavioral health, and social determinants", and whose third line reads "of health"; on the right side of this band add a three-line evidence paragraph whose first line reads "Individuals reporting poor mental health are 1.9x as likely to", whose second line reads "report not receiving the healthcare they need, and 2.5x as likely" (with a comma immediately after "need"), and whose third line reads "to report having multiple unmet social needs⁵", including the numeric strings "1.9x" and "2.5x" and the superscript ⁵. In the fifth and lowest gray band, next to a head-with-spiral icon on the far left, place a three-line left-side challenge paragraph with lines: "Low levels of behavioral health literacy" on line one, "and lingering stigma relating to mental and" on line two, and "substance use disorders" on line three; on the right side of this lowest band add a three-line evidence paragraph whose first line reads "37% of Americans view opioid use disorder as a personal", whose second line reads "weakness and not a disease⁶; 53% of psychiatrists report", and whose third line reads "discriminatory attitudes from other providers to patients⁷", preserving all percent signs, semicolon, and superscript reference markers ⁶ and ⁷. Below the banded content area, near the bottom-center of the slide but above a lower horizontal divider, place a single-line row of source references written with generic placeholders that reads exactly: "1. [Source 1] | 2. [Source 2] | 3. [Source 3] | 4. [Source 4] | 5. [Source 5] | 6. [Source 6] | 7. [Source 7]", using the vertical bar character and spacing between each numbered source. Beneath this reference line add another thin horizontal divider spanning the lower width of the slide. Finally, in the bottom-right corner of the image, above and slightly to the left of the extreme edge, place the brand text "McKinsey & Company", and at the extreme lower-right corner, aligned on the same horizontal baseline, place the slide number "34"; ensure all digits, punctuation, and superscript markers throughout the image exactly match the specified strings and that the overall layout maintains the described left and right columns with five aligned gray bands.'
