  status: "draft"
  public_template: true
  results_status: "not_started"
  results_included: false
  model_versions_verified: false
  note: >-
    本文件只声明拟评候选系列，不声称当前可用的精确 API ID、版本、价格或能力。
    所有 null 字段必须在正式调用前依据供应商控制台与一次非计分冒烟调用核验并冻结。

